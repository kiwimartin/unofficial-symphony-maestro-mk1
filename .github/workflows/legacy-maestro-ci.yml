name: Legacy Maestro macOS Build and Tests

on:
  pull_request:
    paths:
      - "Apps/Maestro/**"
      - "Drivers/Thunderbolt/**"
      - "Drivers/AudioServerPlugin/**"
      - "Drivers/VolumeProxy/**"
      - "Drivers/Shared/**"
      - "Tools/**"
      - "docs/legacy-*.md"
      - "docs/legacy-dual-port-diagnostics.md"
      - ".github/workflows/legacy-maestro-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-swift:
    name: ${{ matrix.label }} build and tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: Sequoia 15
            os_major: "15"
            artifact_label: sequoia-15
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
          - runner: macos-26
            label: Tahoe 26
            os_major: "26"
            artifact_label: tahoe-26
            developer_dir: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select the Sequoia SDK toolchain
        if: matrix.developer_dir != ''
        shell: bash
        env:
          REQUESTED_DEVELOPER_DIR: ${{ matrix.developer_dir }}
        run: |
          set -euo pipefail
          if [ ! -d "$REQUESTED_DEVELOPER_DIR" ]; then
            echo "Required Sequoia Xcode toolchain is unavailable: $REQUESTED_DEVELOPER_DIR" >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$REQUESTED_DEVELOPER_DIR" >> "$GITHUB_ENV"
      - name: Verify host OS and record selected toolchain
        shell: bash
        run: |
          set -euo pipefail
          actual_version="$(sw_vers -productVersion)"
          if [ "${actual_version%%.*}" != "${{ matrix.os_major }}" ]; then
            echo "Runner OS mismatch: expected macOS ${{ matrix.os_major }}, got $actual_version" >&2
            exit 1
          fi
          {
            sw_vers
            uname -m
            xcodebuild -version
            swift --version
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk driverkit --show-sdk-version
          } | tee legacy-build-environment.txt
      - name: Verify common Sequoia/Tahoe deployment policy
        run: python3 Tools/check-platform-compatibility.py --runner-label '${{ matrix.runner }}'
      - name: Release class and own-signing negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s Tools/tests -v 2>&1 | tee legacy-release-tests.log
          python3 Tools/legacy-release-check.py --mode developer > legacy-developer-preflight.json
      - name: Shared USB plugin/proxy contract tests
        run: bash Drivers/Shared/run-tests.sh
      - name: Compile USB AudioServerPlugin without signing/installing
        run: bash Drivers/AudioServerPlugin/Scripts/build.sh --unsigned
      - name: Compile VolumeProxy without signing/installing
        run: |
          mkdir -p build/legacy-ci
          clang -o build/legacy-ci/MaestroVolumeProxy Drivers/VolumeProxy/MaestroVolumeProxy.c -I Drivers/Shared -arch arm64 -mmacosx-version-min=15.0 -framework Foundation -framework CoreAudio -framework AudioToolbox -framework IOKit -Wall -Wextra -O2
      - name: Passive C++ diagnostic invariants
        run: bash Drivers/Thunderbolt/Scripts/test-passive-diagnostics.sh
      - name: Dual-port DMA policy and bounds (sanitizers)
        run: bash Drivers/Thunderbolt/Scripts/test-dual-port-dma.sh
      - name: Audio ring copy and channel isolation (sanitizers)
        run: bash Drivers/Thunderbolt/Scripts/test-audio-ring-copy.sh
      - name: Compile and link unsigned arm64 DriverKit executable (no profiles/install)
        run: bash Drivers/Thunderbolt/Scripts/build.sh --unsigned
      - name: Passive-only driver source safety gates
        run: bash Drivers/Thunderbolt/Scripts/test-passive-driver-source.sh
      - name: Compile passive-only diagnostic driver (no AudioDriverKit or activation)
        run: bash Drivers/Thunderbolt/Scripts/build-passive-diagnostics.sh
      - name: Compile passive legacy diagnostic CLI
        working-directory: Apps/Maestro
        run: swift build --product LegacyXLinkDiagnostics
      - name: Compile standalone passive developer GUI
        working-directory: Apps/Maestro
        run: swift build --product LegacyMaestroPreview
      - name: Compile Maestro SwiftUI executable
        working-directory: Apps/Maestro
        run: swift build --product MaestroApp
      - name: Compile hardware diagnostic CLI
        working-directory: Apps/Maestro
        run: swift build --product HardwareTest
      - name: Build and run Swift package tests (no connected hardware)
        working-directory: Apps/Maestro
        shell: bash
        run: |
          set -euo pipefail
          swift test --xunit-output "$GITHUB_WORKSPACE/legacy-test-results.xml" 2>&1 | tee "$GITHUB_WORKSPACE/legacy-test-output.log"
      - name: Compile release-optimized developer binaries (unsigned)
        working-directory: Apps/Maestro
        run: |
          swift build -c release --product LegacyMaestroPreview
          swift build -c release --product MaestroApp
          swift build -c release --product HardwareTest
          swift build -c release --product LegacyXLinkDiagnostics
      - name: Stage test-only build artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-preview
          python3 Tools/assemble-legacy-preview.py Apps/Maestro/.build/release/LegacyMaestroPreview build/legacy-ci/LegacyMaestroPreview.app
          ditto -c -k --keepParent build/legacy-ci/LegacyMaestroPreview.app build-preview/LegacyMaestroPreview-app.zip
          cp Apps/Maestro/.build/release/MaestroApp build-preview/MaestroApp
          cp Apps/Maestro/.build/release/HardwareTest build-preview/HardwareTest
          cp Apps/Maestro/.build/release/LegacyXLinkDiagnostics build-preview/
          cp Drivers/Thunderbolt/build/com.danielraffel.maestro.thunderbridge build-preview/ThunderBridge-unsigned
          cp Drivers/Thunderbolt/build/passive/SymphonyPassiveDiagnostics-unsigned build-preview/
          cp build/legacy-ci/MaestroVolumeProxy build-preview/
          cp Drivers/AudioServerPlugin/build/ApogeeSymIO.driver/Contents/MacOS/ApogeeSymIO build-preview/ApogeeSymIO-unsigned
          cp legacy-developer-preflight.json build-preview/
          cp docs/legacy-phase-*.md docs/legacy-implementation-status.md build-preview/
          cp docs/legacy-dual-port-diagnostics.md build-preview/
          git rev-parse HEAD > build-preview/SOURCE_COMMIT.txt
          cp legacy-build-environment.txt build-preview/BUILD_ENVIRONMENT.txt
          cat > build-preview/README.txt <<'EOF'
          MAESTRO LEGACY X-SYMPHONY — UNSIGNED DEVELOPMENT BINARIES
          CI runner: ${{ matrix.runner }} (${{ matrix.label }})
          Observed OS, CPU architecture, Xcode, Swift and SDK versions are
          recorded in BUILD_ENVIRONMENT.txt. This build targets the common
          Sequoia/Tahoe baseline; its runner label is not hardware validation.

          This archive includes an isolated unsigned developer .app ZIP. It is
          NOT an installer and NOT a production
          release. These command-line binaries are supplied solely for build
          diagnostics and developer analysis.

          Includes: LegacyMaestroPreview-app.zip (no Sparkle or driver activation),
          unsigned USB plugin/proxy compile products (not installed),
          phase status documents, explicit developer-only preflight report,
          passive LegacyXLinkDiagnostics CLI and unsigned DriverKit
          executable (compile/link evidence only; no installable dext bundle).
          HardwareTest is a separate test tool and can exercise hardware writes.
          LegacyXLinkDiagnostics uses only passive selector 6; it requires a
          suitably signed diagnostic client and driver for actual hardware access.

          Not included: signed shipping app, Sparkle framework, installable DriverKit extension,
          installable AudioServerPlugin bundle, provisioning profiles, code signatures, PKG,
          notarization, or evidence of functioning legacy 64-channel audio.
          Do NOT install this archive over an existing Maestro application.

          A release installer requires own Apple Developer signing identities,
          matching Apple-approved DriverKit entitlements and profiles,
          notarization, physical ThunderBridge testing and release sign-off.

          See docs/FORK_RELEASE_PROCESS.md and
              docs/legacy-first-release-readiness.md.
          EOF
          (cd build-preview && shasum -a 256 * > ../legacy-checksums.txt)
          mv legacy-checksums.txt build-preview/SHA256SUMS.txt
      - name: Verify assembled preview and executable deployment minimums
        run: |
          python3 Tools/check-platform-compatibility.py \
            --runner-label '${{ matrix.runner }}' \
            --smoke-preview --preview-bundle build/legacy-ci/LegacyMaestroPreview.app \
            --binaries Apps/Maestro/.build/release/MaestroApp \
              Apps/Maestro/.build/release/LegacyMaestroPreview \
              Drivers/Thunderbolt/build/com.danielraffel.maestro.thunderbridge \
              Drivers/Thunderbolt/build/passive/SymphonyPassiveDiagnostics-unsigned
      - name: Upload unsigned developer build (not an installer)
        uses: actions/upload-artifact@v4
        with:
          name: maestro-legacy-dev-binaries-${{ matrix.artifact_label }}-${{ github.run_number }}
          path: build-preview/
          retention-days: 14
          if-no-files-found: error
      - name: Upload unit test results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-unit-test-results-${{ matrix.artifact_label }}-${{ github.run_number }}
          path: |
            legacy-build-environment.txt
            legacy-test-output.log
            legacy-release-tests.log
            legacy-test-results.xml
          if-no-files-found: error
          retention-days: 14
